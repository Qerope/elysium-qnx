name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: host tests (${{ matrix.cc }}${{ matrix.san == '1' && ', asan+ubsan' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        san: ['', '1']
    steps:
      - uses: actions/checkout@v4
      - run: make test HOSTCC=${{ matrix.cc }} SAN=${{ matrix.san }}

  kernel:
    name: kernel build (riscv64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - run: make build/kernel.elf
      - run: riscv64-unknown-elf-size build/kernel.elf
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: build/kernel.elf
          retention-days: 14

  qemu-smoke:
    name: boot under qemu
    needs: kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: build
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc
      - run: sh scripts/qemu-smoke.sh build/kernel.elf

  rust:
    name: rust drivers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: riscv64imac-unknown-none-elf
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: wlan state machine tests (host)
        run: cargo test -p wlan
      - name: clippy (target)
        run: cargo clippy -p elysium_drivers --release --target riscv64imac-unknown-none-elf
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: |
          cppcheck --error-exitcode=1 --enable=warning,performance,portability \
            --inline-suppr --suppress=missingIncludeSystem -Iinclude -DELY_HOST \
            kernel/ipc.c kernel/pmap.c kernel/vm_page.c kernel/uaccess.c
