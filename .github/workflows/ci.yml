name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: host tests (${{ matrix.cc }}${{ matrix.san == '1' && ', asan+ubsan' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        san: ['', '1']
    steps:
      - uses: actions/checkout@v4
      - run: make test HOSTCC=${{ matrix.cc }} SAN=${{ matrix.san }}

  kernel:
    name: kernel build (riscv64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
      - run: make build/kernel.elf
      - run: riscv64-unknown-elf-size build/kernel.elf
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: build/kernel.elf
          retention-days: 14

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: |
          cppcheck --error-exitcode=1 --enable=warning,performance,portability \
            --inline-suppr --suppress=missingIncludeSystem -Iinclude -DELY_HOST \
            kernel/ipc.c kernel/pmap.c kernel/vm_page.c kernel/uaccess.c
